{% load l10n %}
{% with subtitles=episode.subtitles.all %}
<div class="player-wrap" tabindex="0" role="group" aria-label="Trình phát phim" data-can-seek="{% if room and not is_host %}false{% else %}true{% endif %}"><video id="player" controls playsinline preload="metadata" controlslist="nodownload" disablepictureinpicture {% if episode.movie.backdrop %}poster="{{ episode.movie.backdrop.url }}"{% endif %} data-ticket="{% url 'ticket' episode.pk %}" data-progress="{% url 'progress' episode.pk %}" data-position="{{ position|default:0|unlocalize }}" data-duration="{{ episode.duration|unlocalize }}">{% for subtitle in subtitles %}<track data-subtitle kind="subtitles" src="{% url 'subtitle' episode.pk subtitle.pk %}" srclang="{{ subtitle.language }}" label="{{ subtitle.label }}">{% endfor %}</video><div class="watermark">LUMIÈRE · #{{ user.pk }}</div>
<button class="player-center" data-player-action="play" aria-label="Phát phim" hidden><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>
<div class="player-controls" hidden><input class="player-range" type="range" min="0" max="100" value="0" step="1" aria-label="Vị trí phát"><div class="player-controls-row"><button class="player-control player-toggle" data-player-action="play" aria-label="Phát"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span class="player-pause-symbol" aria-hidden="true">Ⅱ</span></button><button class="player-control" data-player-action="back" aria-label="Lùi 10 giây"><span class="player-skip" aria-hidden="true">−10</span></button><button class="player-control" data-player-action="forward" aria-label="Tua 10 giây"><span class="player-skip" aria-hidden="true">+10</span></button><span class="player-time"><span data-player-time>0:00</span> / <span data-player-duration>0:00</span></span><div class="player-end-controls">{% if subtitles %}<label class="player-caption-control"><span aria-hidden="true">CC</span><select class="player-subtitles" aria-label="Phụ đề"><option value="off">Tắt phụ đề</option>{% for subtitle in subtitles %}<option value="{{ forloop.counter0 }}">{{ subtitle.label }}</option>{% endfor %}</select></label>{% endif %}<button class="player-control" data-player-action="mute" aria-label="Tắt tiếng"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4V9Zm12-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><input type="range" class="player-volume" min="0" max="1" step=".05" value="1" aria-label="Âm lượng"><span class="player-quality" data-player-quality></span><button class="player-control" data-player-action="fullscreen" aria-label="Toàn màn hình"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div></div></div>
<p id="player-status" role="status" class="muted">Đang chuẩn bị nguồn phát…</p><button id="retry-player" class="btn small secondary" hidden>Thử phát lại</button>
{% endwith %}
