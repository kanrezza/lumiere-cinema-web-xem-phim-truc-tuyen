<dialog class="quickview-dialog" id="movie-quickview" aria-labelledby="quickview-title" aria-describedby="quickview-description quickview-status-message">
  <div class="quickview-surface">
    <button class="quickview-close" type="button" aria-label="Đóng xem nhanh" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="quickview-hero"><img id="quickview-image" alt=""><div class="quickview-shade"></div><span class="quickview-wordmark">lumière<span>.</span></span></div>
    <div class="quickview-copy">
      <div class="quickview-kicker"><span>PHIM TRÊN LUMIÈRE</span><span class="quickview-vip" id="quickview-vip" hidden>VIP</span><span class="cinema-tag" id="quickview-cinema" hidden>Chiếu rạp</span></div>
      <h2 id="quickview-title"></h2>
      <p class="quickview-meta" id="quickview-meta"></p>
      <div class="quickview-ratings"><p class="quickview-availability" id="quickview-status"></p><a class="imdb-rating" id="quickview-imdb" target="_blank" rel="noopener noreferrer" aria-label="Mở điểm và thông tin trên IMDb" hidden><span class="imdb-wordmark">IMDb</span><span class="imdb-score"><span id="quickview-imdb-score"></span><small>/10</small></span><span class="imdb-source-arrow" aria-hidden="true">↗</span></a></div>
      <p class="quickview-description" id="quickview-description"></p>
      <p class="quickview-status-message" id="quickview-status-message" hidden></p>
      <div class="quickview-actions"><a class="quickview-play" id="quickview-play" hidden><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span id="quickview-play-label">Xem ngay</span></a><a class="quickview-trailer" id="quickview-trailer" hidden><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>Xem trailer</a><a class="quickview-details" id="quickview-details">Thông tin phim <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    </div>
  </div>
</dialog>
