name: Lumière CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumiere-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python_app
    env:
      DEBUG: "1"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python_app/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: python_app/frontend/package-lock.json
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Build and type-check Vue
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Check Django schema and run backend regressions
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test cinema cinema.audit_experience_cases
      - name: Run browser logic regressions
        run: node --test tests/*.test.cjs

  staging:
    name: HTTPS staging smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python_app/deploy/staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate short-lived staging secrets
        run: python3 init_env.py
      - name: Start an isolated HTTPS staging stack
        run: |
          ./manage.sh build
          ./manage.sh up -d --wait --wait-timeout 240
      - name: Run smoke checks through HTTPS
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ./manage.sh exec -T gateway cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/lumiere-root.crt"
          python3 smoke.py --env .env --ca "$RUNNER_TEMP/lumiere-root.crt" --decode
      - name: Rehearse database and media recovery
        run: ./manage.sh exec -T app python manage.py drill_lumiere_restore
      - name: Show staging diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            ./manage.sh ps -a
            ./manage.sh logs --no-color --tail=120
          fi
      - name: Remove the runner's staging stack
        if: always()
        run: |
          if [ -f .env ]; then ./manage.sh down -v --remove-orphans; fi
